  google_sign_in: ^6.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3
  file_picker: ^12.0.0
  emoji_picker_flutter: ^4.5.3
  drift: ^2.28.0
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5
  uuid: ^4.5.1
  get_it: ^8.0.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.0
